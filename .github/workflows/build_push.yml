name: CI
on:
  workflow_dispatch:
    inputs:
      build_ref:
        description: 'Release version number'
        required: true
        default: '0.20.1'
        type: string
  push:
    tags:
      - v*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build app
    runs-on: 'ubuntu-24.04'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up JDK
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Check code format
        run: ./gradlew spotlessCheck

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Verify SQLDelight migrations
        run: ./gradlew verifySqlDelightMigration

      - name: Build app
        run: ./gradlew assembleRelease -Pinclude-telemetry -Penable-updater

      - name: Upload mapping
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mapping-${{ github.sha }}
          path: app/build/outputs/mapping/release

      # Sign APK and create release for tags

      - name: Get tag name
        if: (inputs.build_ref != '' || startsWith(github.ref, 'refs/tags/')) && github.repository == 'alzhahirdev/mihonsync'
        run: |
          set -x

          build_ref=$(echo "${{ inputs.build_ref }}")
          if [ build_ref != '' ]; then
            echo "VERSION_TAG=$build_ref" >> $GITHUB_ENV
          else
            echo "VERSION_TAG=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_ENV
          fi

      - name: Sign APK
        if: (inputs.build_ref != '' || startsWith(github.ref, 'refs/tags/')) && github.repository == 'alzhahirdev/mihonsync'
        uses: r0adkll/sign-android-release@f30bdd30588842ac76044ecdbd4b6d0e3e813478
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '35.0.1'

      - name: Clean up build artifacts
        if: (inputs.build_ref != '' || startsWith(github.ref, 'refs/tags/')) && github.repository == 'alzhahirdev/mihonsync'
        run: |
          set -e

          mv app/build/outputs/apk/release/app-universal-release-signed.apk mihonsync-${{ env.VERSION_TAG }}.apk
          sha=`sha256sum mihonsync-${{ env.VERSION_TAG }}.apk | awk '{ print $1 }'`
          echo "APK_UNIVERSAL_SHA=$sha" >> $GITHUB_ENV

          mv app/build/outputs/apk/release/app-arm64-v8a-release-signed.apk mihonsync-arm64-v8a-${{ env.VERSION_TAG }}.apk
          sha=`sha256sum mihonsync-arm64-v8a-${{ env.VERSION_TAG }}.apk | awk '{ print $1 }'`
          echo "APK_ARM64_V8A_SHA=$sha" >> $GITHUB_ENV

          mv app/build/outputs/apk/release/app-armeabi-v7a-release-signed.apk mihonsync-armeabi-v7a-${{ env.VERSION_TAG }}.apk
          sha=`sha256sum mihonsync-armeabi-v7a-${{ env.VERSION_TAG }}.apk | awk '{ print $1 }'`
          echo "APK_ARMEABI_V7A_SHA=$sha" >> $GITHUB_ENV

          mv app/build/outputs/apk/release/app-x86-release-signed.apk mihonsync-x86-${{ env.VERSION_TAG }}.apk
          sha=`sha256sum mihonsync-x86-${{ env.VERSION_TAG }}.apk | awk '{ print $1 }'`
          echo "APK_X86_SHA=$sha" >> $GITHUB_ENV

          mv app/build/outputs/apk/release/app-x86_64-release-signed.apk mihonsync-x86_64-${{ env.VERSION_TAG }}.apk
          sha=`sha256sum mihonsync-x86_64-${{ env.VERSION_TAG }}.apk | awk '{ print $1 }'`
          echo "APK_X86_64_SHA=$sha" >> $GITHUB_ENV

      - name: Create Release
        if: (inputs.build_ref != '' || startsWith(github.ref, 'refs/tags/')) && github.repository == 'alzhahirdev/mihonsync'
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: MihonSync ${{ env.VERSION_TAG }}
          body: |
            ---

            ### Checksums

            | Variant | SHA-256 |
            | ------- | ------- |
            | Universal | ${{ env.APK_UNIVERSAL_SHA }}
            | arm64-v8a | ${{ env.APK_ARM64_V8A_SHA }}
            | armeabi-v7a | ${{ env.APK_ARMEABI_V7A_SHA }}
            | x86 | ${{ env.APK_X86_SHA }} |
            | x86_64 | ${{ env.APK_X86_64_SHA }} |

            ## If you are unsure which version to choose then go with mihonsync-${{ env.VERSION_TAG }}.apk
          files: |
            mihonsync-${{ env.VERSION_TAG }}.apk
            mihonsync-arm64-v8a-${{ env.VERSION_TAG }}.apk
            mihonsync-armeabi-v7a-${{ env.VERSION_TAG }}.apk
            mihonsync-x86-${{ env.VERSION_TAG }}.apk
            mihonsync-x86_64-${{ env.VERSION_TAG }}.apk
          draft: true
          prerelease: false
          token: ${{ github.token }}
